services:
  postgres:
    image: postgres:15-alpine
    container_name: guiyang_oj_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guiyang_oj}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-guiyang_oj}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guiyang_network

  redis:
    image: redis:7-alpine
    container_name: guiyang_oj_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guiyang_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guiyang_oj_backend
    ports:
      - "3003:3001"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-guiyang_oj}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your local environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your local environment}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your local environment}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3100,http://localhost:8080,http://127.0.0.1:3100,http://127.0.0.1:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./config:/app/config
      - /app/node_modules
    networks:
      - guiyang_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guiyang_oj_frontend
    ports:
      - "3100:80"
    environment:
      VITE_API_URL: /
    depends_on:
      - backend
    networks:
      - guiyang_network

  nginx:
    image: nginx:alpine
    container_name: guiyang_oj_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - guiyang_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: guiyang_oj_pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.invalid}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in your local environment}
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - guiyang_network

  judge-service:
    build:
      context: ./judge-service
      dockerfile: Dockerfile
    container_name: guiyang_oj_judge
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-guiyang_oj}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SANDBOX_IMAGE: guiyang_oj_sandbox:latest
      WORKER_ID: judge_worker_1
      MAX_CONCURRENT: 2
      COMPILE_TIMEOUT: 10000
      RUN_TIMEOUT: 2000
      MEMORY_LIMIT: 268435456
      SANDBOX_TEMP_DIR: /judge-sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge_sandbox:/judge-sandbox
    networks:
      - guiyang_network
    privileged: true

volumes:
  postgres_data:
  redis_data:
  judge_sandbox:

networks:
  guiyang_network:
    driver: bridge
